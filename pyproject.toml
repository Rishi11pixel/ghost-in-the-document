[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghost-in-the-document"
version = "0.2.0"
description = "Offline-first document privacy scanner and redaction tool"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pydantic>=2.7,<3",
  "pymupdf>=1.24,<2",
  "python-docx>=1.1,<2",
  "lxml>=5,<7",
  "gradio>=5,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]
ai = ["gliner>=0.2.20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
include = ["app*"]
